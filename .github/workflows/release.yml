name: build and release

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: static-rsync-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      commit: ${{ steps.version.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve upstream version
        id: version
        run: |
          version=$(cat VERSION)
          changed=false
          if test "$GITHUB_EVENT_NAME" = schedule; then
            latest=$(curl -fsSL https://download.samba.org/pub/rsync/src/ \
              | sed -n 's/.*href="rsync-\([0-9][0-9.]*\)\.tar\.gz".*/\1/p' \
              | sort -V | tail -1)
            test -n "$latest"
            if test "$latest" != "$version"; then
              version=$latest
              changed=true
              echo "$version" > VERSION
              git config user.name github-actions
              git config user.email github-actions@github.com
              git add VERSION
              git commit -m "build: update rsync to $version"
              git push
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: github.event_name != 'schedule' || needs.version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build in pinned Alpine
        run: |
          echo '${{ needs.version.outputs.version }}' > VERSION
          docker run --rm -v "$PWD:/work" -w /work \
            alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce \
            sh -c 'apk add --no-cache build-base curl gnupg file binutils acl-dev acl-static attr-dev attr-static openssl-dev openssl-libs-static zstd-dev zstd-static lz4-dev lz4-static && ./build.sh'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-rsync-${{ matrix.arch }}
          path: dist/*

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.tar.gz

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: static-rsync-*
          path: dist
          merge-multiple: true

      - name: Publish new artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version='${{ needs.version.outputs.version }}'
          if ! gh release view "v$version" >/dev/null 2>&1; then
            gh release create "v$version" dist/*.tar.gz dist/*.sha256 \
              --target '${{ needs.version.outputs.commit }}' \
              --title "rsync $version (static)" \
              --notes "Statically linked musl build of rsync $version."
          else
            for asset in dist/*.tar.gz dist/*.sha256; do
              name=${asset##*/}
              if ! gh release view "v$version" --json assets --jq '.assets[].name' \
                | grep -Fxq "$name"; then
                gh release upload "v$version" "$asset"
              fi
            done
          fi
